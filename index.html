<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁 Quà Tặng Đặc Biệt Cho Bạn</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    position: relative;
    padding: 20px;
  }

  .container {
    text-align: center;
    background: rgba(255, 255, 255, 0.95);
    padding: 50px 60px;
    border-radius: 30px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    position: relative;
    z-index: 10;
    animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
    max-width: 90vw;
    width: 600px;
  }

  @keyframes popIn {
    0% { transform: scale(0); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  h1 {
    font-size: 2.2em;
    background: linear-gradient(45deg, #f093fb, #f5576c, #4facfe);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 20px;
    animation: gradientShift 3s ease infinite;
  }

  @keyframes gradientShift {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  .gift {
    font-size: 6em;
    margin: 20px 0;
    display: inline-block;
    animation: shake 1s infinite;
    cursor: pointer;
    user-select: none;
  }

  @keyframes shake {
    0%, 100% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-10deg) scale(1.1); }
    75% { transform: rotate(10deg) scale(1.1); }
  }

  p {
    font-size: 1.2em;
    color: #555;
    margin-bottom: 25px;
    line-height: 1.6;
  }

  .question {
    font-size: 1.4em;
    color: #333;
    font-weight: bold;
    margin: 30px 0;
    line-height: 1.5;
  }

  .question .highlight {
    background: linear-gradient(45deg, #f5576c, #f093fb);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-size: 1.3em;
  }

  button {
    font-size: 1.2em;
    padding: 15px 40px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(45deg, #f5576c, #f093fb);
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(245, 87, 108, 0.4);
    transition: all 0.3s;
    margin: 8px;
  }

  button:hover {
    transform: translateY(-3px) scale(1.05);
    box-shadow: 0 15px 30px rgba(245, 87, 108, 0.6);
  }

  button:active { transform: translateY(0); }

  #yesBtn {
    background: linear-gradient(45deg, #43e97b, #38f9d7);
    box-shadow: 0 10px 20px rgba(67, 233, 123, 0.4);
  }

  #yesBtn:hover {
    box-shadow: 0 15px 30px rgba(67, 233, 123, 0.6);
  }

  #noBtn {
    background: linear-gradient(45deg, #95a5a6, #7f8c8d);
    box-shadow: 0 10px 20px rgba(149, 165, 166, 0.4);
    position: relative;
    transition: all 0.25s;
  }

  .emoji-float {
    position: fixed;
    font-size: 2.5em;
    pointer-events: none;
    animation: floatUp 4s linear forwards;
    z-index: 9999;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(-120vh) rotate(720deg); opacity: 0; }
  }

  .confetti {
    position: fixed;
    width: 12px;
    height: 12px;
    top: -20px;
    z-index: 9998;
    animation: fall linear forwards;
  }

  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); }
  }

  .money-rain {
    position: fixed;
    top: -80px;
    font-size: 3em;
    z-index: 9997;
    pointer-events: none;
    animation: moneyFall linear forwards;
  }

  @keyframes moneyFall {
    to { transform: translateY(110vh) rotate(360deg); }
  }

  .hidden { display: none !important; }

  .final-message {
    font-size: 1.3em;
    line-height: 1.8;
    color: #333;
  }

  .final-message .big {
    font-size: 1.8em;
    display: block;
    margin: 20px 0;
    background: linear-gradient(45deg, #f5576c, #4facfe);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-weight: bold;
  }

  .rainbow {
    animation: rainbow 2s linear infinite;
    font-weight: bold;
  }

  @keyframes rainbow {
    0% { color: #ff0000; }
    16% { color: #ff9900; }
    33% { color: #ffff00; }
    50% { color: #00ff00; }
    66% { color: #0099ff; }
    83% { color: #9900ff; }
    100% { color: #ff0000; }
  }

  @media (max-width: 500px) {
    .container { padding: 35px 25px; }
    h1 { font-size: 1.6em; }
    .gift { font-size: 4em; }
    .question { font-size: 1.1em; }
    button { font-size: 1em; padding: 12px 25px; }
    .final-message { font-size: 1.05em; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- Bước 1: Mời nhận quà -->
  <div id="step1">
    <h1>🎁 Quà Tặng Đặc Biệt!</h1>
    <div class="gift" id="giftIcon">🎁</div>
    <p>Nhấn vào hộp quà để xem điều bất ngờ nha! 😉</p>
    <button onclick="openGift()">Mở Quà Ngay</button>
  </div>

  <!-- Bước 2: Câu hỏi yes/no -->
  <div id="step2" class="hidden">
    <h1>💰 Câu Hỏi Triệu Đô</h1>
    <p class="question">
      Bạn có muốn tui tặng<br>
      <span class="highlight">1 TỶ ĐỒNG</span> 💵 không?
    </p>
    <div style="margin-top:20px;">
      <button id="yesBtn" onclick="sayYes()">CÓ, MUỐN! 🤑</button>
      <button id="noBtn" onmouseover="runAway()" onclick="runAway()">KHÔNG CẦN 💸</button>
    </div>
  </div>

  <!-- Bước 3: Kết quả -->
  <div id="step3" class="hidden">
    <div class="final-message" id="finalMsg"></div>
    <button onclick="location.reload()" style="margin-top:30px;">🔄 Chơi Lại</button>
  </div>
</div>

<script>
  // ===== Âm thanh bằng Web Audio API =====
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  function playTone(freq, duration = 0.15, type = 'sine') {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    } catch(e) {}
  }

  function playVictory() {
    const notes = [523, 659, 784, 1047];
    notes.forEach((f, i) => setTimeout(() => playTone(f, 0.2), i * 120));
  }

  function playCoinSound() {
    playTone(988, 0.08, 'square');
    setTimeout(() => playTone(1319, 0.15, 'square'), 80);
  }

  // ===== Bước 1: Mở quà =====
  function openGift() {
    document.getElementById('step1').classList.add('hidden');
    document.getElementById('step2').classList.remove('hidden');
    burstEmojis(['🎊', '🎉', '✨', '🎈', '💖'], 30);
    playVictory();
  }

  // ===== Bước 2: Nút KHÔNG chạy trốn =====
  let noCount = 0;
  const noTexts = [
    'KHÔNG CẦN 💸',
    'Chắc chưa? 🤨',
    '1 tỷ đó nghen! 😱',
    'Tiền đó bạn ơi! 💰',
    'Đừng từ chối 😢',
    'Suy nghĩ lại đi! 🥺',
    '1 tỷ = 1000 triệu đó 😳',
    'Mua được biệt thự luôn 🏰',
    'Mua được siêu xe 🏎️',
    'Nút này bị lỗi rồi 🤪',
    'Bấm CÓ đi mà 🙏',
    'Không cho bấm nữa 😤',
    'Chạy đâu cho thoát 🏃',
    'Bắt được rồi nè 😏',
    'Từ chối 1 tỷ = điên 🤣'
  ];

  function runAway() {
    const btn = document.getElementById('noBtn');
    noCount++;
    
    btn.textContent = noTexts[Math.min(noCount, noTexts.length - 1)];
    
    const scale = Math.max(0.2, 1 - noCount * 0.06);
    btn.style.transform = `scale(${scale})`;
    
    if (window.innerWidth > 768) {
      const x = (Math.random() - 0.5) * 400;
      const y = (Math.random() - 0.5) * 300;
      btn.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
    }
    
    playTone(200 + Math.random() * 300, 0.1, 'square');
    
    if (noCount > 12) {
      btn.disabled = true;
      btn.textContent = 'Thoát không được đâu 😂';
      sayYes();
    }
  }

  // ===== Bước 3: Nói CÓ =====
  function sayYes() {
    document.getElementById('step2').classList.add('hidden');
    document.getElementById('step3').classList.remove('hidden');
    
    document.getElementById('finalMsg').innerHTML = 
      'Chúc mừng bạn đã chọn <b>"CÓ"</b>! 🎉<br>' +
      'Vậy thì... tui sẽ tặng bạn...' +
      '<br><span class="big rainbow">🎉 1 TỶ... LỜI CHÚC! 🎉</span>' +
      '<br><span style="color:#e74c3c; font-weight:bold; font-size:1.1em;">' +
      '😜 BẠN ĐÃ BỊ LỪA RỒI! 😜</span>' +
      '<br><br>💵 Tiền thì không có...<br>' +
      '🤑 Nhưng mà có nguyên <b>1 tỷ niềm vui</b> gửi tới bạn!<br>' +
      '<br>Chúc bạn ngày càng <b>giàu</b>, <b>đẹp</b>, <b>may mắn</b> và <b>thành công</b>! ❤️<br>' +
      '<br><i>— Từ người bạn đáng yêu của bạn 😘</i>';
    
    // Mưa tiền + pháo hoa
    burstEmojis(['🎉', '🎊', '💖', '✨', '🌟', '🎈', '🥳', '💝'], 50);
    createConfetti(80);
    createMoneyRain(40);
    playVictory();
    
    // Tiếng xu vàng leng keng
    setTimeout(() => {
      for (let i = 0; i < 8; i++) {
        setTimeout(playCoinSound, i * 150);
      }
    }, 400);
  }

  // ===== Hiệu ứng emoji bay =====
  function burstEmojis(emojis, count) {
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'emoji-float';
        el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.bottom = '-50px';
        el.style.fontSize = (1.5 + Math.random() * 2) + 'em';
        el.style.animationDuration = (3 + Math.random() * 2) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 6000);
      }, i * 60);
    }
  }

  // ===== Confetti =====
  function createConfetti(count) {
    const colors = ['#f5576c', '#4facfe', '#f093fb', '#43e97b', '#fa709a', '#fee140'];
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        c.style.width = (8 + Math.random() * 8) + 'px';
        c.style.height = c.style.width;
        c.style.animationDuration = (2 + Math.random() * 2) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5000);
      }, i * 30);
    }
  }

  // ===== Mưa tiền 💵 =====
  function createMoneyRain(count) {
    const moneyEmojis = ['💵', '💰', '💸', '🤑', '💴', '💶', '💷', '🪙'];
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const m = document.createElement('div');
        m.className = 'money-rain';
        m.textContent = moneyEmojis[Math.floor(Math.random() * moneyEmojis.length)];
        m.style.left = Math.random() * 100 + 'vw';
        m.style.animationDuration = (3 + Math.random() * 2) + 's';
        document.body.appendChild(m);
        setTimeout(() => m.remove(), 6000);
      }, i * 80);
    }
  }

  // ===== Click hộp quà =====
  document.getElementById('giftIcon').addEventListener('click', openGift);
</script>
</body>
</html>
